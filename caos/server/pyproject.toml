# This file is the single source of truth for server dependencies.
# caos/server/requirements{,-dev}.txt are COMPILED from it with hashes — after
# any change here, regenerate both (the command is in each file's header) or
# caos/tests/test_dependency_pins.py goes red.

[project]
name = "caos-server"
version = "0.1.0"
description = "CAOS credit-analysis server on LangGraph"
requires-python = ">=3.12"
dependencies = [
    # Execution schema versioning (DECISIONS.md §10.12): exact pins on the run engine.
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    # psycopg's pure-Python wrapper arrives transitively via
    # langgraph-checkpoint-postgres, but WITHOUT an implementation: no
    # psycopg_binary, no psycopg_c, and the slim base has no libpq.
    # `postgresql+psycopg://` then dies on import with "no pq wrapper available"
    # — the production app could not reach PostgreSQL at all. Pinned explicitly
    # so the driver is a declared dependency rather than a transitive accident.
    "psycopg[binary]==3.3.4",
    "langchain-anthropic==1.6.1",
    "fastapi==0.139.*",
    # Direct import in api/__init__.py (also a transitive fastapi dep, but that
    # floor is 0.46 — GZipMiddleware's exclude_content_types needs 1.x).
    "starlette>=1.6",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "openpyxl>=3.1",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    # Direct import in engine/runtime.py (also a transitive checkpoint-sqlite dep).
    "aiosqlite>=0.20",
    # engine/openrouter.py: the OpenRouter binding talks HTTP directly (no SDK)
    # and estimates tokens locally, because OpenRouter has no pre-call counting
    # endpoint and the budget reserves before it calls. httpx was previously a
    # dev-only pin for the test client; the OpenRouter path makes it a runtime
    # import.
    "httpx>=0.27",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    # The documented lint command runs under this extra; without it `uv run
    # --extra dev ruff check …` fails to spawn.
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["caos*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
