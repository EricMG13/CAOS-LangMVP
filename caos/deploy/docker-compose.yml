services:
  db:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_DB: caos
      POSTGRES_USER: caos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caos -d caos"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks: [internal]

  clamav:
    image: clamav/clamav:1.5@sha256:0e85467cb0d6e7d860a45035707741cd5ffc032ffefc6002a3510c75b6d07027
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
      - ./clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1:1"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ../..
      dockerfile: caos/deploy/Dockerfile
      target: app
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      clamav: { condition: service_healthy }
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://caos:${POSTGRES_PASSWORD}@db:5432/caos
      CAOS_STORAGE_DIR: /vault
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?set EDGE_PROXY_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      # Kept in step with Caddy's request_body cap; the app refuses a source
      # above MAX_SOURCE_MB well before the transport ceiling.
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-32}
      MAX_SOURCE_MB: ${MAX_SOURCE_MB:-25}
      PORT: "8000"
      CPDR_AGENT_ENABLED: ${CPDR_AGENT_ENABLED:-false}
      CANONICAL_AGENT_ENABLED: ${CANONICAL_AGENT_ENABLED:-false}
      CPDR_PILOT_CASE_IDS: ${CPDR_PILOT_CASE_IDS:-}
      CPDR_PILOT_SUBJECTS: ${CPDR_PILOT_SUBJECTS:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_EXECUTION_ENABLED: ${AGENT_EXECUTION_ENABLED:-false}
    volumes:
      - vault-data:/vault
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    build:
      context: ../..
      dockerfile: caos/deploy/Dockerfile
      target: worker
    restart: unless-stopped
    command: ["python", "worker.py"]
    depends_on:
      db: { condition: service_healthy }
      app: { condition: service_healthy }
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://caos:${POSTGRES_PASSWORD}@db:5432/caos
      CAOS_STORAGE_DIR: /vault
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?set EDGE_PROXY_SECRET}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      CPDR_AGENT_ENABLED: ${CPDR_AGENT_ENABLED:-false}
      CANONICAL_AGENT_ENABLED: ${CANONICAL_AGENT_ENABLED:-false}
      CPDR_PILOT_CASE_IDS: ${CPDR_PILOT_CASE_IDS:-}
      CPDR_PILOT_SUBJECTS: ${CPDR_PILOT_SUBJECTS:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-6}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AGENT_EXECUTION_ENABLED: ${AGENT_EXECUTION_ENABLED:-false}
    volumes:
      - vault-data:/vault
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=1g,mode=1777"]
    networks: [internal]

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    command: ["--config=/etc/oauth2-proxy.cfg"]
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: https://${CAOS_DOMAIN:?set CAOS_DOMAIN}/oauth2/callback
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OAUTH2_PROXY_OIDC_ISSUER_URL:?set OAUTH2_PROXY_OIDC_ISSUER_URL}
      OAUTH2_PROXY_EMAIL_DOMAINS: ${CAOS_EMAIL_DOMAIN:?set CAOS_EMAIL_DOMAIN}
    volumes:
      - ./oauth2-proxy.cfg:/etc/oauth2-proxy.cfg:ro
    networks: [internal]

  caddy:
    image: caddy:2.11-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    restart: unless-stopped
    depends_on:
      oauth2-proxy: { condition: service_started }
    ports: ["80:80", "443:443"]
    environment:
      CAOS_DOMAIN: ${CAOS_DOMAIN:?set CAOS_DOMAIN}
      EDGE_PROXY_SECRET: ${EDGE_PROXY_SECRET:?set EDGE_PROXY_SECRET}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

volumes:
  postgres-data:
  clamav-data:
  vault-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
