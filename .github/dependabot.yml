# Dependency scanning (Phase-4 launch gate). Native GitHub feature — surfaces
# security alerts and opens update PRs; no CI runtime, no blocking gate.
# Five ecosystems: frontend (npm), server (pip), the CI workflows (github-actions),
# the deploy Dockerfile base images (docker), and the compose service image pins
# (docker-compose). The two docker ecosystems close the gap that let
# oauth2-proxy drift behind its CVE-fixed release: the security CI job audits pip
# and npm dependencies but never scans container image tags.
version: 2
updates:
  # Grouped deliberately. One grouped PR per ecosystem means one review instead of
  # several concurrent range bumps; major updates stay separate because they need
  # individual judgement. The server currently uses its checked-in requirements
  # ranges directly; no generated lockfile gate is assumed here.
  - package-ecosystem: npm
    directory: /caos/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # Blocked upstream, not by us. eslint-config-next bundles the plugins that
    # break, and 16.3.3 — the version pinned here — is the latest stable, so
    # there is nothing to bump to:
    #   eslint 10  -> eslint-plugin-react calls contextOrFilename.getFilename,
    #                 removed in ESLint 10
    #   typescript 7 -> typescript-eslint refuses outright: "does not support TS 7.0"
    # Both majors were opened, rebased onto current main, and failed the frontend
    # lint job on exactly these errors. Ignoring the MAJOR only: minor and patch
    # updates for both still arrive through the group above, so security fixes on
    # the 9.x / 5.x lines are unaffected.
    # LIFT THIS once eslint-config-next ships support — check its bundled
    # typescript-eslint and eslint-plugin-react, not its peerDependencies, which
    # are permissive enough to look compatible when they are not.
    ignore:
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: pip
    directory: /caos/server
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfile base images (node:24-slim, python:3.14-slim).
  - package-ecosystem: docker
    directory: /caos/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # Compose service image pins (oauth2-proxy, postgres, caddy). docker-compose
  # support is GA since Feb 2025; scans the `image:` tags docker can't see.
  - package-ecosystem: docker-compose
    directory: /caos/deploy
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
