name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Nightly — backend and frontend regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install -r caos/server/requirements-dev.txt
          npm ci --prefix caos/frontend
      - name: Backend regression
        run: python -m pytest caos/tests -q -W always
      - name: Full lint and route security
        run: |
          python -m ruff check --config ruff.toml caos/server caos/tests --exclude caos/server/caos/methodology/vendor
          python run_sec_audit.py
      - name: Frontend regression
        run: |
          npm run lint --prefix caos/frontend -- --max-warnings=0
          npm run build --prefix caos/frontend
      - name: Frontend typecheck
        working-directory: caos/frontend
        run: npx tsc --noEmit
      - name: Build and stage static frontend
        run: bash caos/scripts/build_frontend.sh
      - name: Install Playwright Chromium
        working-directory: caos/frontend
        run: npx playwright install --with-deps chromium
      - name: Start combined app
        run: |
          nohup env ANTHROPIC_API_KEY="" python caos/server/run.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Workbench journey and accessibility
        working-directory: caos/frontend
        run: |
          npm run test:workbench
          npm run a11y
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-browser-server-log
          path: server.log
          if-no-files-found: ignore

  operational:
    name: Nightly — deployment and methodology checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: bash -n caos/deploy/*.sh caos/scripts/*.sh
      - name: Compose and deployment checks
        run: |
          docker compose -f caos/deploy/docker-compose.yml config -q --no-interpolate
          docker compose --env-file caos/.env.example -f caos/deploy/docker-compose.yml config -q
          python caos/deploy/verify_image_resources.py
          python "Modular OS/tools/check_module_consistency.py"
      - name: Full-history secret scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
