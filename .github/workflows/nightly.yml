name: Nightly

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    name: Nightly — backend and frontend regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
      GEMINI_API_KEY: ""
      OPENROUTER_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - name: Install dependencies
        run: |
          pip install --require-hashes -r caos/server/requirements-dev.txt
          npm ci --prefix caos/frontend
      - name: Restore the real-issuer corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
          restore-keys: corpus-
      - name: Fetch the real-issuer corpus
        id: fetch
        # Best effort: the documents come from the SEC and from issuer sites, so
        # a fetch failure leaves the corpus tests skipping with a reason rather
        # than turning an unrelated change red. fetch.sh re-downloads only what a
        # restored cache is missing.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::warning::SEC_USER_AGENT repo variable is unset, so the real-issuer corpus tests will skip. Set it to a contact EDGAR accepts, e.g. 'Jane Analyst jane@example.com' — EDGAR answers 403 to a user agent without an email-shaped contact."
            exit 1
          fi
          caos/tests/corpus/fetch.sh
      - name: Save the real-issuer corpus
        # Only a complete fetch is cached. A partial one stored under the
        # sources.txt key would be restored forever and never retried, silently
        # disabling the corpus tests for the documents it is missing.
        if: steps.fetch.outcome == 'success' && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
      - name: Backend regression
        # CORPUS_FULL classifies every corpus document and runs every live route,
        # rather than the per-PR smoke subset.
        env:
          CORPUS_FULL: "1"
        run: python -m pytest caos/tests -q -W always
      - name: Full lint and route security
        run: |
          python -m ruff check --config ruff.toml caos/server caos/tests --exclude caos/server/caos/methodology/vendor
          python run_sec_audit.py
      - name: Frontend regression
        run: |
          npm run lint --prefix caos/frontend -- --max-warnings=0
          npm run build --prefix caos/frontend
      - name: Frontend typecheck
        working-directory: caos/frontend
        run: npx tsc --noEmit
      - name: Build and stage static frontend
        run: bash caos/scripts/build_frontend.sh
      - name: Install Playwright Chromium
        working-directory: caos/frontend
        run: npx playwright install --with-deps chromium
      - name: Start combined app
        run: |
          nohup env ANTHROPIC_API_KEY="" python caos/server/run.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Workbench journey and accessibility
        working-directory: caos/frontend
        run: |
          npm run test:workbench
          npm run a11y
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-browser-server-log
          path: server.log
          if-no-files-found: ignore

  operational:
    name: Nightly — deployment and methodology checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Shell syntax
        run: bash -n caos/deploy/*.sh caos/scripts/*.sh caos/tests/corpus/fetch.sh
      - name: Compose and deployment checks
        run: |
          docker compose -f caos/deploy/docker-compose.yml config -q --no-interpolate
          # .env.example ships every required secret EMPTY so an operator who
          # copies without filling gets Compose's `${VAR:?}` refusal. Feeding it
          # to `config` as-is therefore always fails -- which it silently did
          # here, aborting the step under `bash -e` before the two checks below
          # ever ran. Fill the blanks first, exactly as ci.yml does, so this
          # still catches a variable MISSING from the example.
          sed 's/^\([A-Z_][A-Z0-9_]*\)=$/\1=nightly-placeholder-value-not-a-secret/' \
            caos/.env.example > "$RUNNER_TEMP/.env.filled"
          docker compose --env-file "$RUNNER_TEMP/.env.filled" -f caos/deploy/docker-compose.yml config -q
          python caos/deploy/verify_image_resources.py
          python "Modular OS/tools/check_module_consistency.py"
      - name: Full-history secret scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
