name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: caos/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build

  server:
    name: Server — tests and full lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound matches caos/server/pyproject.toml requires-python.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # test_recorded_review.py::test_the_script_reviews_this_repository_head_
          # without_a_block diffs HEAD~1..HEAD, so this job's checkout needs one
          # parent commit — the default single-commit clone doesn't carry one.
          # security-review.yml already uses fetch-depth: 0 for the same script's
          # real PR-review invocation; this job only needs the one extra commit.
          fetch-depth: 2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - run: pip install --require-hashes -r caos/server/requirements-dev.txt
      - name: Install the PDF text shaper
        # `render_frozen_pdf` shells out to pango-view for the Unicode path and
        # refuses with PDF_UNICODE_RENDERER_UNAVAILABLE when the binary is absent.
        # The runtime image already installs these two (caos/deploy/Dockerfile),
        # so without them here CI is testing a thinner environment than it ships
        # — and the gap is invisible on a developer Mac, where Homebrew supplies
        # pango-view and the test passes locally.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk pango1.0-tools
      - name: Full lint
        run: >-
          python -m ruff check --config ruff.toml caos/server caos/tests
          --exclude caos/server/caos/methodology/vendor
      - name: Route security audit
        run: python run_sec_audit.py
      - name: Quality ledger covers every route and product file
        # docs/QUALITY_LEDGER.csv is only a source of truth while it is complete.
        # This fails when a route is added without a ledger row, or when a new
        # subsystem appears that no feature claims — stdlib and git only.
        run: python docs/quality_ledger_coverage.py
      # One matrix leg only: the corpus is not interpreter-sensitive.
      - name: Restore the real-issuer corpus
        id: corpus
        if: matrix.python-version == '3.14'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
          restore-keys: corpus-
      - name: Fetch the real-issuer corpus
        id: fetch
        if: matrix.python-version == '3.14'
        # A missing required byte is a failed qualification, never a silent skip.
        run: caos/tests/corpus/fetch.sh
      - name: Save the real-issuer corpus
        # Only a complete fetch is cached. A partial one stored under the
        # sources.txt key would be restored forever and never retried, silently
        # disabling the corpus tests for the documents it is missing.
        if: matrix.python-version == '3.14' && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
      - name: Backend regression suite
        env:
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: python -m pytest caos/tests -q -W always

  browser:
    name: Browser — workbench journey and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # WEB-002: the six documents-only journeys in every supported engine.
        # One framework (Playwright) drives all three; the smoke reads
        # CAOS_BROWSER and writes a structured report plus a trace and a
        # screenshot on failure under caos/frontend/test-results/<browser>/.
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - name: Build static frontend
        run: bash caos/scripts/build_frontend.sh
      - name: Install server dependencies
        run: pip install --require-hashes -r caos/server/requirements-dev.txt
      - name: Install Playwright ${{ matrix.browser }}
        working-directory: caos/frontend
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start combined app
        run: |
          # Every route is provider-backed; the keyless browser gates bind the
          # development-only host-control provider (DECISIONS §14 D8), which is
          # orchestration proof, never analysis. That binding is production-refused,
          # so the gates run dev.py — run.py is the production entrypoint only.
          nohup env ANTHROPIC_API_KEY="" CAOS_PROVIDER=host_control AGENT_EXECUTION_ENABLED=true python caos/server/dev.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Workbench journey
        working-directory: caos/frontend
        env:
          CAOS_BROWSER: ${{ matrix.browser }}
        run: npm run test:workbench
      - name: Accessibility sweep
        # WEB-007: axe over every destination and state (empty, loading,
        # populated, error, refusal, review, filed); axe-core runs in one
        # engine, the journey above is what differs per engine.
        if: matrix.browser == 'chromium'
        working-directory: caos/frontend
        run: npm run a11y
      - name: Retain the browser report, traces and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-${{ matrix.browser }}-${{ github.sha }}
          path: |
            caos/frontend/test-results
            server.log
          if-no-files-found: ignore

  deploy-assets:
    name: Deploy — scripts, compose, authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: bash -n caos/deploy/*.sh caos/scripts/*.sh
      - name: Compose schema and example environment
        run: |
          docker compose -f caos/deploy/docker-compose.yml config -q --no-interpolate
          # .env.example ships every required secret EMPTY so a real operator who
          # copies without filling gets Compose's `${VAR:?}` refusal instead of a
          # production booting on a documented placeholder. That is the point of
          # the file, so it cannot be fed to `config` as-is. Fill the blanks here
          # and validate that: a variable MISSING from the example still fails
          # (`:?` fires on an absent name), which is what this step exists to
          # catch — while an intentionally empty value does not.
          sed 's/^\([A-Z_][A-Z0-9_]*\)=$/\1=ci-placeholder-value-not-a-secret/' \
            caos/.env.example > "$RUNNER_TEMP/.env.filled"
          docker compose --env-file "$RUNNER_TEMP/.env.filled" -f caos/deploy/docker-compose.yml config -q
      - name: Required secrets ship empty in the example
        run: |
          # The fail-closed posture is itself a contract: if someone restores a
          # placeholder here, Compose stops refusing and validate_runtime becomes
          # the only thing standing between a copied .env and production.
          for name in POSTGRES_PASSWORD EDGE_PROXY_SECRET SESSION_SECRET \
                      OAUTH2_PROXY_CLIENT_SECRET OAUTH2_PROXY_COOKIE_SECRET; do
            grep -qx "$name=" caos/.env.example || {
              echo "$name must ship EMPTY in caos/.env.example so Compose fails closed" >&2
              exit 1
            }
          done
      - name: Corpus taxonomy consistency
        run: python "Modular OS/tools/check_module_consistency.py"

  image:
    name: Image — build and resource verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build app image
        run: docker build --target app --tag caos-app:ci --file caos/deploy/Dockerfile .
      - name: Build worker image
        run: docker build --target worker --tag caos-worker:ci --file caos/deploy/Dockerfile .
      - name: Verify immutable app resources
        run: docker run --rm --entrypoint python caos-app:ci verify_image_resources.py --runtime app
      - name: Verify worker resources and export runtime
        run: docker run --rm --entrypoint python caos-worker:ci verify_image_resources.py --runtime worker
      - name: App boots against PostgreSQL
        run: |
          # The 401-test suite runs on SQLite and verify_image_resources checks
          # resources, not connectivity — so nothing here ever proved the image
          # can reach PostgreSQL. It could not: psycopg arrived transitively with
          # no pq implementation and the app died on import. This is the cheapest
          # check that fails when that returns.
          set -eu
          NET=caos-ci-net
          PG=postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          docker network create "$NET"
          docker run -d --name caos-ci-db --network "$NET" \
            -e POSTGRES_USER=caos -e POSTGRES_PASSWORD=ci-not-a-placeholder \
            -e POSTGRES_DB=caos "$PG"
          for _ in $(seq 1 30); do
            docker exec caos-ci-db pg_isready -U caos -d caos >/dev/null 2>&1 && break
            sleep 2
          done
          # ENVIRONMENT=production so validate_runtime runs for real: a
          # PostgreSQL URL and non-placeholder secrets of adequate length.
          docker run -d --name caos-ci-app --network "$NET" \
            -e ENVIRONMENT=production \
            -e DATABASE_URL="postgresql+psycopg://caos:ci-not-a-placeholder@caos-ci-db:5432/caos" \
            -e EDGE_PROXY_SECRET=ci-edge-secret-that-is-long-enough-000000 \
            -e SESSION_SECRET=ci-session-secret-that-is-long-enough-000 \
            -e CAOS_STORAGE_DIR=/vault caos-app:ci
          ok=""
          for _ in $(seq 1 30); do
            if docker exec caos-ci-app python -c \
              "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the app never served /api/health against PostgreSQL"
            docker logs --tail 40 caos-ci-app
            exit 1
          fi
          # Serving health is not enough — prove it actually wrote to PostgreSQL.
          # The whole schema is created at startup since Task 12a (the model
          # and deliverable tables included), so a fresh deployment restores
          # under the same table set as a used one; test_deploy_topology.py
          # pins this list to the store's startup schema.
          missing=$(docker exec caos-ci-db psql -Atq -U caos -d caos -c \
            "SELECT t FROM unnest(ARRAY['cases','sources','source_sets','audit_events','audit_chain_heads','runs','run_nodes','run_artifacts','run_events','run_budgets','model_builds','model_revisions','model_revision_heads','deliverable_revisions','deliverable_frozen','deliverable_opinions','deliverable_freeze_jobs','deliverable_filing_receipts','deliverable_threads']) t WHERE to_regclass('public.'||t) IS NULL")
          if [ -n "$missing" ]; then
            echo "::error::the app did not create its schema in PostgreSQL; missing: $missing"
            exit 1
          fi
          echo "app booted against PostgreSQL, served /api/health, and created its schema"
      - name: Tear down the boot check
        if: always()
        run: |
          docker rm -f caos-ci-app caos-ci-db >/dev/null 2>&1 || true
          docker network rm caos-ci-net >/dev/null 2>&1 || true
      - name: Trivy scan and SBOM — fixable HIGH/CRITICAL gate bound to the image digests
        run: |
          # Fetched from the release TAG, never `main`, and verified before it
          # runs: a curl|sh from a mutable branch executes whatever that branch
          # holds at the moment CI happens to run. Bump the version and the
          # digest together.
          installer="$RUNNER_TEMP/trivy-install.sh"
          expected=e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
          curl -sSfL -o "$installer" \
            https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh
          echo "$expected  $installer" | sha256sum -c -
          sh "$installer" -b "$RUNNER_TEMP/trivy-bin" v0.72.0
          trivy="$RUNNER_TEMP/trivy-bin/trivy"
          out="$RUNNER_TEMP/scans"; mkdir -p "$out"
          # SEC-001/SEC-002: the vulnerability inventory and a CycloneDX SBOM per
          # image, each checked against a coverage floor and against the id of
          # the image just built (a scan of the wrong or an empty image fails),
          # then bound together with the commit in scan-manifest.json.
          binding=""
          for target in app worker; do
            image_id=$(docker image inspect --format '{{.Id}}' "caos-$target:ci")
            "$trivy" image --scanners vuln --list-all-pkgs --format json \
              --output "$out/trivy-$target.json" "caos-$target:ci"
            python caos/scripts/scan_floors.py trivy "$out/trivy-$target.json" --image-id "$image_id"
            "$trivy" image --format cyclonedx --output "$out/sbom-$target.cdx.json" "caos-$target:ci"
            python caos/scripts/scan_floors.py sbom "$out/sbom-$target.cdx.json" --image "caos-$target:ci"
            "$trivy" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "caos-$target:ci"
            binding="$binding --image $target=$image_id --report trivy-$target=$out/trivy-$target.json --report sbom-$target=$out/sbom-$target.cdx.json"
          done
          # shellcheck disable=SC2086
          python caos/scripts/scan_floors.py manifest "$out/scan-manifest.json" --commit "$GITHUB_SHA" $binding
      - name: Retain the image scans and SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-scans-${{ github.sha }}
          path: ${{ runner.temp }}/scans
          if-no-files-found: error
          retention-days: 90

  postgres:
    name: PostgreSQL — two-connection races and instance locks
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same digest the image job boots the app against and Compose ships.
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: caos
          POSTGRES_PASSWORD: ci-not-a-placeholder
          POSTGRES_DB: caos
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U caos -d caos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - run: pip install --require-hashes -r caos/server/requirements-dev.txt
      - name: Two-connection races and the instance locks against the pinned container
        # CAOS_REQUIRE_POSTGRES turns a missing URL into a failure, never a skip:
        # this job exists to run these tests, so a silent skip is a red build.
        # Every test creates and drops its own database, so the service's
        # `caos` superuser is the right role.
        env:
          CAOS_TEST_POSTGRES_URL: postgresql+psycopg://caos:ci-not-a-placeholder@localhost:5432/caos
          CAOS_REQUIRE_POSTGRES: "1"
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: python -m pytest caos/tests/test_postgres_races.py caos/tests/test_single_instance.py -q -W always -rs

  security:
    name: Security — dependency and SAST gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - name: Install the scanners from the hashed lock
        # SEC-003: the scanners are installed like the application — every
        # wheel hash-pinned — so a compromised re-release of pip-audit or
        # bandit cannot enter the gate that judges the rest.
        run: pip install --require-hashes -r caos/server/requirements-security.txt
      - name: Dependency CVEs
        run: |
          out="$RUNNER_TEMP/scans"; mkdir -p "$out"
          pip-audit --require-hashes -r caos/server/requirements.txt --progress-spinner off \
            --format json --output "$out/pip-audit.json"
          python caos/scripts/scan_floors.py pip-audit "$out/pip-audit.json"
      - name: Python SAST
        run: |
          # bandit SKIPS any file it cannot parse and still exits 0, so a gate
          # that scanned nothing is indistinguishable from a clean one. bandit
          # 1.7.10 reaches for the ast.Constant.s alias a newer interpreter no
          # longer provides — under Python 3.14 it skips all 35 server files and
          # passes. The setup-python pin above is therefore load-bearing, so
          # scan_floors.py asserts the outcome instead of trusting it.
          bandit -r caos/server/caos \
            -x caos/server/caos/methodology/vendor \
            --severity-level high --confidence-level medium \
            -f json -o "$RUNNER_TEMP/scans/bandit.json"
          python caos/scripts/scan_floors.py bandit "$RUNNER_TEMP/scans/bandit.json"
      - name: Frontend dependency advisories
        working-directory: caos/frontend
        run: |
          npm audit --audit-level=high
          npm audit --json > "$RUNNER_TEMP/scans/npm-audit.json" || true
          python ../scripts/scan_floors.py npm-audit "$RUNNER_TEMP/scans/npm-audit.json"
      - name: Secret scan
        # Digest-pinned image (SEC-003). gitleaks exits 0 with "no leaks found"
        # even when git itself failed underneath it, so the floor check reads
        # its log for the commits it actually scanned (SEC-002).
        run: |
          docker run --rm -v "$PWD:/repo" -v "$RUNNER_TEMP/scans:/out" \
            ghcr.io/gitleaks/gitleaks:v8.18.4@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner --verbose \
            --report-format json --report-path /out/gitleaks.json 2> "$RUNNER_TEMP/scans/gitleaks.log"
          python caos/scripts/scan_floors.py gitleaks "$RUNNER_TEMP/scans/gitleaks.json" --log "$RUNNER_TEMP/scans/gitleaks.log"
      - name: Bind the scan results to the commit
        run: >-
          python caos/scripts/scan_floors.py manifest "$RUNNER_TEMP/scans/scan-manifest.json" --commit "$GITHUB_SHA"
          --image source-tree=$GITHUB_SHA
          --report pip-audit="$RUNNER_TEMP/scans/pip-audit.json"
          --report bandit="$RUNNER_TEMP/scans/bandit.json"
          --report npm-audit="$RUNNER_TEMP/scans/npm-audit.json"
          --report gitleaks-log="$RUNNER_TEMP/scans/gitleaks.log"
      - name: Retain the scan results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scans-${{ github.sha }}
          path: ${{ runner.temp }}/scans
          if-no-files-found: error
          retention-days: 90
