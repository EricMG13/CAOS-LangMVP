name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: caos/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm run test:unit
      - run: npm run build

  server:
    name: Server — tests and full lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound matches caos/server/pyproject.toml requires-python.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - run: pip install -r caos/server/requirements-dev.txt
      - name: Full lint
        run: >-
          python -m ruff check --config ruff.toml caos/server caos/tests
          --exclude caos/server/caos/methodology/vendor
      - name: Route security audit
        run: python run_sec_audit.py
      - name: Quality ledger covers every route and product file
        # docs/QUALITY_LEDGER.csv is only a source of truth while it is complete.
        # This fails when a route is added without a ledger row, or when a new
        # subsystem appears that no feature claims — stdlib and git only.
        run: python docs/quality_ledger_coverage.py
      # One matrix leg only: the corpus is not interpreter-sensitive, and two
      # legs racing would double a 78 MB download and collide on the cache key.
      - name: Restore the real-issuer corpus
        id: corpus
        if: matrix.python-version == '3.14'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
          restore-keys: corpus-
      - name: Fetch the real-issuer corpus
        id: fetch
        if: matrix.python-version == '3.14'
        # Best effort: the documents come from the SEC and from issuer sites, so
        # a fetch failure leaves the corpus tests skipping with a reason rather
        # than turning an unrelated change red. fetch.sh re-downloads only what a
        # restored cache is missing.
        continue-on-error: true
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          if [ -z "${SEC_USER_AGENT}" ]; then
            echo "::warning::SEC_USER_AGENT repo variable is unset, so the real-issuer corpus tests will skip. Set it to a contact EDGAR accepts, e.g. 'Jane Analyst jane@example.com' — EDGAR answers 403 to a user agent without an email-shaped contact."
            exit 1
          fi
          caos/tests/corpus/fetch.sh
      - name: Save the real-issuer corpus
        # Only a complete fetch is cached. A partial one stored under the
        # sources.txt key would be restored forever and never retried, silently
        # disabling the corpus tests for the documents it is missing.
        if: matrix.python-version == '3.14' && steps.fetch.outcome == 'success' && steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
      - name: Backend regression suite
        env:
          ANTHROPIC_API_KEY: ""
          GEMINI_API_KEY: ""
          OPENROUTER_API_KEY: ""
        run: python -m pytest caos/tests -q -W always

  browser:
    name: Browser — workbench journey and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - name: Build static frontend
        run: bash caos/scripts/build_frontend.sh
      - name: Install server dependencies
        run: pip install -r caos/server/requirements-dev.txt
      - name: Install Playwright Chromium
        working-directory: caos/frontend
        run: npx playwright install --with-deps chromium
      - name: Start combined app
        run: |
          nohup env ANTHROPIC_API_KEY="" python caos/server/run.py > server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/health && exit 0
            sleep 1
          done
          cat server.log
          exit 1
      - name: Workbench journey
        working-directory: caos/frontend
        run: npm run test:workbench
      - name: Accessibility sweep
        working-directory: caos/frontend
        run: npm run a11y
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-server-log
          path: server.log
          if-no-files-found: ignore

  deploy-assets:
    name: Deploy — scripts, compose, authority
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax
        run: bash -n caos/deploy/*.sh caos/scripts/*.sh
      - name: Compose schema and example environment
        run: |
          docker compose -f caos/deploy/docker-compose.yml config -q --no-interpolate
          # .env.example ships every required secret EMPTY so a real operator who
          # copies without filling gets Compose's `${VAR:?}` refusal instead of a
          # production booting on a documented placeholder. That is the point of
          # the file, so it cannot be fed to `config` as-is. Fill the blanks here
          # and validate that: a variable MISSING from the example still fails
          # (`:?` fires on an absent name), which is what this step exists to
          # catch — while an intentionally empty value does not.
          sed 's/^\([A-Z_][A-Z0-9_]*\)=$/\1=ci-placeholder-value-not-a-secret/' \
            caos/.env.example > "$RUNNER_TEMP/.env.filled"
          docker compose --env-file "$RUNNER_TEMP/.env.filled" -f caos/deploy/docker-compose.yml config -q
      - name: Required secrets ship empty in the example
        run: |
          # The fail-closed posture is itself a contract: if someone restores a
          # placeholder here, Compose stops refusing and validate_runtime becomes
          # the only thing standing between a copied .env and production.
          for name in POSTGRES_PASSWORD EDGE_PROXY_SECRET SESSION_SECRET \
                      OAUTH2_PROXY_CLIENT_SECRET OAUTH2_PROXY_COOKIE_SECRET; do
            grep -qx "$name=" caos/.env.example || {
              echo "$name must ship EMPTY in caos/.env.example so Compose fails closed" >&2
              exit 1
            }
          done
      - name: Corpus taxonomy consistency
        run: python "Modular OS/tools/check_module_consistency.py"

  image:
    name: Image — build and resource verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build app image
        run: docker build --target app --tag caos-app:ci --file caos/deploy/Dockerfile .
      - name: Build worker image
        run: docker build --target worker --tag caos-worker:ci --file caos/deploy/Dockerfile .
      - name: Verify immutable app resources
        run: docker run --rm --entrypoint python caos-app:ci verify_image_resources.py --runtime app
      - name: Verify worker resources and export runtime
        run: docker run --rm --entrypoint python caos-worker:ci verify_image_resources.py --runtime worker
      - name: App boots against PostgreSQL
        run: |
          # The 401-test suite runs on SQLite and verify_image_resources checks
          # resources, not connectivity — so nothing here ever proved the image
          # can reach PostgreSQL. It could not: psycopg arrived transitively with
          # no pq implementation and the app died on import. This is the cheapest
          # check that fails when that returns.
          set -eu
          NET=caos-ci-net
          PG=postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          docker network create "$NET"
          docker run -d --name caos-ci-db --network "$NET" \
            -e POSTGRES_USER=caos -e POSTGRES_PASSWORD=ci-not-a-placeholder \
            -e POSTGRES_DB=caos "$PG"
          for _ in $(seq 1 30); do
            docker exec caos-ci-db pg_isready -U caos -d caos >/dev/null 2>&1 && break
            sleep 2
          done
          # ENVIRONMENT=production so validate_runtime runs for real: a
          # PostgreSQL URL and non-placeholder secrets of adequate length.
          docker run -d --name caos-ci-app --network "$NET" \
            -e ENVIRONMENT=production \
            -e DATABASE_URL="postgresql+psycopg://caos:ci-not-a-placeholder@caos-ci-db:5432/caos" \
            -e EDGE_PROXY_SECRET=ci-edge-secret-that-is-long-enough-000000 \
            -e SESSION_SECRET=ci-session-secret-that-is-long-enough-000 \
            -e CAOS_STORAGE_DIR=/vault caos-app:ci
          ok=""
          for _ in $(seq 1 30); do
            if docker exec caos-ci-app python -c \
              "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')" >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 2
          done
          if [ -z "$ok" ]; then
            echo "::error::the app never served /api/health against PostgreSQL"
            docker logs --tail 40 caos-ci-app
            exit 1
          fi
          # Serving health is not enough — prove it actually wrote to PostgreSQL.
          # Only the store and run metadata are created at startup; model and
          # deliverable tables arrive lazily on first use of those surfaces.
          missing=$(docker exec caos-ci-db psql -Atq -U caos -d caos -c \
            "SELECT t FROM unnest(ARRAY['cases','sources','source_sets','audit_events','runs','run_nodes','run_artifacts','run_events']) t WHERE to_regclass('public.'||t) IS NULL")
          if [ -n "$missing" ]; then
            echo "::error::the app did not create its schema in PostgreSQL; missing: $missing"
            exit 1
          fi
          echo "app booted against PostgreSQL, served /api/health, and created its schema"
      - name: Tear down the boot check
        if: always()
        run: |
          docker rm -f caos-ci-app caos-ci-db >/dev/null 2>&1 || true
          docker network rm caos-ci-net >/dev/null 2>&1 || true
      - name: Trivy scan — fixable HIGH/CRITICAL gate
        run: |
          # Fetched from the release TAG, never `main`, and verified before it
          # runs: a curl|sh from a mutable branch executes whatever that branch
          # holds at the moment CI happens to run. Bump the version and the
          # digest together.
          installer="$RUNNER_TEMP/trivy-install.sh"
          expected=e00df553be558995b994758bc8995956554a16937f456dc6615b0cc411bfec7a
          curl -sSfL -o "$installer" \
            https://raw.githubusercontent.com/aquasecurity/trivy/v0.72.0/contrib/install.sh
          echo "$expected  $installer" | sha256sum -c -
          sh "$installer" -b "$RUNNER_TEMP/trivy-bin" v0.72.0
          "$RUNNER_TEMP/trivy-bin/trivy" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 caos-app:ci
          "$RUNNER_TEMP/trivy-bin/trivy" image --scanners vuln \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 caos-worker:ci

  security:
    name: Security — dependency and SAST gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: caos/frontend/package-lock.json
      - run: pip install pip-audit==2.10.1 bandit==1.7.10
      - name: Dependency CVEs
        run: pip-audit -r caos/server/requirements.txt
      - name: Python SAST
        run: |
          # bandit SKIPS any file it cannot parse and still exits 0, so a gate
          # that scanned nothing is indistinguishable from a clean one. bandit
          # 1.7.10 reaches for the ast.Constant.s alias a newer interpreter no
          # longer provides — under Python 3.14 it skips all 35 server files and
          # passes. The setup-python pin above is therefore load-bearing, so
          # assert the outcome instead of trusting it.
          bandit -r caos/server/caos \
            -x caos/server/caos/methodology/vendor \
            --severity-level high --confidence-level medium \
            -f json -o "$RUNNER_TEMP/bandit.json"
          python - "$RUNNER_TEMP/bandit.json" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          errors = report.get("errors", [])
          loc = report["metrics"]["_totals"]["loc"]
          if errors:
              sys.exit(f"bandit could not parse {len(errors)} file(s) and still exited 0: "
                       f"{[e.get('filename') for e in errors][:5]}")
          # Second, weaker signal, and a different failure: bandit can parse every
          # file it is GIVEN and still cover nothing if -x or the path is wrong.
          # The server is ~9.6k lines; half that means the gate lost its target.
          if loc < 5000:
              sys.exit(f"bandit scanned only {loc} lines - the gate is not covering the server")
          print(f"bandit scanned {loc} lines with no parse errors")
          PY
      - name: Frontend dependency advisories
        working-directory: caos/frontend
        run: npm audit --audit-level=high
      - name: Secret scan
        run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.18.4
          detect --source=/repo --config=/repo/.gitleaks.toml --redact --no-banner
