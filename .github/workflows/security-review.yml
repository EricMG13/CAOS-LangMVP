# Recorded, read-only review of every pull-request diff (ETR-B06, SEC-004,
# SEC-005). This replaced the AI pull-request review, which handed the diff —
# attacker-controlled text — to an agent holding an API key and a write token.
#
# What runs here holds no secret and no write permission, never sends the diff
# anywhere, and cannot be instructed by it: caos/scripts/recorded_review.py
# matches every added line against a fixed rule table (unpinned actions,
# fork-privileged triggers, write tokens, event text in run blocks, AI agents,
# curl|sh, credential literals, vendored-bundle edits without a decision,
# trusted client role headers, raw HTML in the frontend, …) and writes a JSON
# record that is retained whether the verdict is green or red. A BLOCK rule
# fails the check; a review that examined zero files exits 2, so a green
# check that looked at nothing cannot happen. caos/tests/test_recorded_review.py
# proves the rules fire on planted diffs and that this file stays read-only.
name: Security Review

on:
  pull_request:

permissions:
  contents: read

jobs:
  recorded-review:
    name: Recorded diff review — read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Record the review
        env:
          # Commit identities only, bound through env: no event text reaches a
          # shell line, and the script reads the diff as data.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --unified=0 "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/pr.diff"
          python caos/scripts/recorded_review.py --diff "$RUNNER_TEMP/pr.diff" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP/recorded-review.json"
      - name: Retain the record
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: recorded-review-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/recorded-review.json
          if-no-files-found: error
          retention-days: 90
