name: Enterprise qualification

# The live qualification matrix (Task 11, DECISIONS §14.20): one binding × six
# pathways × supported depths × required packs × three cold repetitions,
# scored against the attested answer keys. Dispatch-only, on a protected
# environment that holds the provider credential and the external corpus
# packs. Nothing here is skipped or continued on error: a missing byte,
# credential, answer key or cell exits non-zero and the job is red, which is
# the designed state until every external input exists.

on:
  workflow_dispatch:
    inputs:
      packs:
        description: "Comma-separated pack ids to run (empty = every required cell)"
        required: false
        default: ""
      repetitions:
        description: "Cold repetitions per cell (policy: 3 for a live binding)"
        required: false
        default: "3"
      reviewer:
        description: "Reviewer bound into every result"
        required: true

permissions:
  contents: read

concurrency:
  group: enterprise-qualification
  cancel-in-progress: false

jobs:
  live-matrix:
    name: Live matrix — qualified provider binding
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # The protected environment carries ANTHROPIC_API_KEY and the external
    # corpus location; required reviewers on the environment gate the run.
    environment: enterprise-qualification
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENROUTER_API_KEY: ""
      CAOS_PROVIDER: ""
      AGENT_EXECUTION_ENABLED: "true"
      CAOS_QUALIFICATION_REVIEWER: ${{ inputs.reviewer }}
      CAOS_BUILD_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: caos/server/requirements-dev.txt
      - name: Install dependencies
        run: pip install --require-hashes -r caos/server/requirements-dev.txt
      - name: Install the PDF text shaper
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk pango1.0-tools
      - name: Restore the real-issuer corpus
        id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
          restore-keys: corpus-
      - name: Fetch the real-issuer corpus
        # Network retrieval stays here, outside pytest; every digest is verified
        # and a missing required byte fails the job, never a skip.
        run: caos/tests/corpus/fetch.sh
      - name: Save the real-issuer corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: caos/tests/corpus/documents
          key: corpus-${{ hashFiles('caos/tests/corpus/sources.txt') }}
      - name: Stage the external packs from the protected store
        # The licensed marks (C20), the stressed pack (C21) and the research
        # pack (C22) never enter git. The environment supplies them as one
        # encrypted archive; absent or undecryptable, the matrix runs and
        # reports those cells BLOCKED EXTERNAL, and the verdict stays red.
        env:
          CORPUS_EXTERNAL_ARCHIVE_B64: ${{ secrets.CORPUS_EXTERNAL_ARCHIVE_B64 }}
        run: |
          # The runner context is not available in job-level env; export the
          # location from the shell for every later step.
          CAOS_CORPUS_EXTERNAL_DIR="$RUNNER_TEMP/corpus-external"
          echo "CAOS_CORPUS_EXTERNAL_DIR=$CAOS_CORPUS_EXTERNAL_DIR" >> "$GITHUB_ENV"
          mkdir -p "$CAOS_CORPUS_EXTERNAL_DIR"
          if [ -n "$CORPUS_EXTERNAL_ARCHIVE_B64" ]; then
            printf '%s' "$CORPUS_EXTERNAL_ARCHIVE_B64" | base64 -d > "$RUNNER_TEMP/corpus-external.tar"
            tar -xf "$RUNNER_TEMP/corpus-external.tar" -C "$CAOS_CORPUS_EXTERNAL_DIR"
          else
            echo "no external pack archive configured: C20, C21 and C22 will report BLOCKED EXTERNAL"
          fi
      - name: Plan
        run: python caos/tests/corpus/qualify.py plan --binding live
      - name: Run the matrix
        run: >-
          python caos/tests/corpus/qualify.py matrix --binding live
          --repetitions "${{ inputs.repetitions }}"
          --packs "${{ inputs.packs }}"
          --reviewer "${{ inputs.reviewer }}"
          --out "$RUNNER_TEMP/qualification-evidence"
      - name: Retain the evidence
        # The evidence is retained whether the verdict is green or red; a red
        # matrix is evidence too. This is the one step that runs after failure.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qualification-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/qualification-evidence
          if-no-files-found: error
          # The repository's artifact retention ceiling; the evidence directory
          # itself is the durable copy, retained under the candidate identity.
          retention-days: 90
